apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-github-user/your-kubernetes-repo.git
    targetRevision: main
    path: nodejs-argocd-demo/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
