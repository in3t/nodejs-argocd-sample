apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-argocd-sample
  namespace: nodejs
  labels:
    app.kubernetes.io/name: nodejs-argocd-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nodejs-argocd-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodejs-argocd-sample
    spec:
      containers:
        - name: app
          image: docker.io/in3t/node-js-app:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          