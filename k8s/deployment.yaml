apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-argocd-sample
  labels:
    app.kubernetes.io/name: nodejs-argocd-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nodejs-argocd-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodejs-argocd-sample
    spec:
      containers:
        - name: app
          image: ghcr.io/REPLACE_WITH_YOUR_GITHUB_USER/nodejs-argocd-sample:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
